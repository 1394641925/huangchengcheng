  <div class="dlist">
    <a href="index.html"><span class="ico">◈</span>首页</a><a href="services.html" class="cur"><span class="ico">壹</span>服务项目</a>

<div class="crumb"><div class="wrap"><a href="index.html">首页</a><span>/</span><a href="services.html">服务项目</a><span>/</span><span id="crumbName">服务详情</span></div></div>

<section><div class="wrap">
  <div class="detail" id="detail"></div>
  <hr style="margin:52px 0 30px;border:none;border-top:1px solid var(--line)">
  <div class="sec-head" style="margin-bottom:26px"><span class="kicker">MORE SERVICES</span><h2>相关服务</h2></div>
  <div class="prod-grid" id="related"></div>
</div></section>

<footer class="foot"><div class="wrap"><div class="bottom"><span>© 2026 皇城殡仪服务馆 · 本站为虚构商业演示网站</span><span>隐私政策 · 服务条款</span></div></div></footer>
<script src="assets/data.js"></script><script src="assets/app.js"></script>
<script>
(function(){
  var id=new URLSearchParams(location.search).get('id')||'p01';
  var p=window.HJ.getProduct(id)||window.HJ.PRODUCTS[0];
  document.title=p.name+' — 皇城殡仪';
  document.getElementById('crumbName').textContent=p.name;
  var size=p.sizes[0],qty=1,box=document.getElementById('detail');
  box.innerHTML=
    '<div class="gallery"><img id="mainImg" src="'+p.img+'" alt="'+p.name+'"></div>'+
    '<div><span class="tag">'+p.tags.join(' · ')+'</span>'+
      '<h1>'+p.name+'</h1><div class="sub">服务编号 '+p.id.toUpperCase()+' · 皇城殡仪 · 支持预约</div>'+
      '<div class="price-big">'+window.HJ.money(p.price)+' <del>'+window.HJ.money(p.old)+'</del></div>'+
      '<p class="small" style="margin:6px 0 16px">'+p.detail+'</p>'+
      '<div class="opts"><h5>选择规格</h5><div class="size-opts" id="sizes">'+
        p.sizes.map(function(s,i){return '<button class="'+(i===0?'on':'')+'" data-s="'+s+'">'+s+'</button>'}).join('')+'</div></div>'+
      '<div class="opts"><h5>数量</h5><div class="qty"><button id="minus">−</button><span id="qty">1</span><button id="plus">+</button></div></div>'+
      '<div class="buybar"><button class="btn btn-copper" id="addCart">预约此服务</button>'+
        '<a href="appointment.html?id='+p.id+'" class="btn btn-solid">直接预约</a>'+
        '<a href="agent.html" class="btn btn-outline">咨询顾问</a></div>'+
      '<div class="notice">有宗教仪式或特殊流程需求？拨打 400-673-0529，专业顾问为您妥善安排。</div>'+
      '<h3 style="font-family:var(--serif);font-size:18px;margin:24px 0 10px;letter-spacing:.08em">服务说明</h3>'+
      '<ul class="spec-list">'+
        '<li><b>服务标准</b><span>'+p.material+'</span></li>'+
        '<li><b>服务包含</b><span>'+p.include+'</span></li>'+
        '<li><b>可选规格</b><span>'+p.sizes.join(' / ')+'</span></li>'+
        '<li><b>服务类别</b><span>'+p.cat+'</span></li>'+
        '<li><b>响应时效</b><span>24 小时响应 · 市区最快 30 分钟</span></li>'+
      '</ul>'+
    '</div>';
  document.getElementById('sizes').addEventListener('click',function(e){
    if(e.target.tagName!=='BUTTON')return;
    this.querySelectorAll('button').forEach(function(b){b.classList.remove('on')});
    e.target.classList.add('on');size=e.target.dataset.s;
  });
  document.getElementById('minus').addEventListener('click',function(){if(qty>1){qty--;document.getElementById('qty').textContent=qty}});
  document.getElementById('plus').addEventListener('click',function(){qty++;document.getElementById('qty').textContent=qty});
  document.getElementById('addCart').addEventListener('click',function(){
    window.HJ.addCart(p.id,size,qty);window.HJToast('已加入预约清单');
  });
  var rel=window.HJ.PRODUCTS.filter(function(x){return x.id!==p.id}).slice(0,4),rg=document.getElementById('related');
  rel.forEach(function(x){
    var el=document.createElement('div');el.className='prod';
    el.innerHTML='<a class="img" href="service.html?id='+x.id+'"><img src="'+x.img+'" alt="'+x.name+'"></a>'+
      '<div class="body"><h4><a href="service.html?id='+x.id+'">'+x.name+'</a></h4><div class="desc">'+x.desc+'</div>'+
      '<div class="price"><b>'+window.HJ.money(x.price)+'</b><del>'+window.HJ.money(x.old)+'</del></div>'+
      '<div class="foot"><a href="service.html?id='+x.id+'" class="btn btn-outline btn-sm">详情</a>'+
      '<a href="appointment.html?id='+x.id+'" class="btn btn-copper btn-sm">预约</a></div></div>';
    rg.appendChild(el);
  });
  var c=document.getElementById('drawerClose');
  if(c)c.addEventListener('click',function(){document.getElementById('drawerMask').classList.remove('on');document.getElementById('drawer').classList.remove('on')});
})();
</script>
</body></html>
