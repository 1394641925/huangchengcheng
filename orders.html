<div class="pagehead"><div class="wrap"><h1>订单查询</h1><p>输入订单号与联系电话，或通过本地记录查看您在本站提交的订单。</p></div></div>
<div class="crumb"><div class="wrap"><a href="index.html">首页</a><span>/</span>订单查询</div></div>

<section><div class="wrap" style="max-width:860px">
  <div class="card section-card">
    <h4 style="font-family:var(--serif);font-size:18px;margin-bottom:16px">查询订单</h4>
    <div class="form-grid">
      <div class="field"><label>订单号</label><input id="qNo" placeholder="例如 HC-20261122-1234"></div>
      <div class="field"><label>联系电话</label><input id="qPhone" placeholder="下单时填写的手机号"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
      <button class="btn btn-navy" id="qBtn">查询订单</button>
      <button class="btn btn-ghost" id="qAll">查看本地全部订单</button>
    </div>
  </div>
  <div id="result"></div>
</div></section>

<footer class="foot"><div class="wrap"><div class="bottom"><span>© 2026 皇城殡仪 HUANGCHENG · 本站为虚构商业演示网站</span><span>隐私政策 · 服务条款</span></div></div></footer>
<script src="assets/data.js"></script><script src="assets/app.js"></script>
<script>
(function(){
  var orders=window.HJ.readOrders(),res=document.getElementById('result');
  function card(o){
    return '<div class="card order-card"><div class="oh"><div><b>'+o.no+'</b> <span class="tiny">'+o.time+'</span></div><span class="status">'+o.status+'</span></div>'+
      '<div class="items">'+o.items.map(function(x){return '<div style="text-align:center"><img src="'+x.img+'" alt=""><div class="tiny">×'+x.qty+'</div></div>'}).join('')+
      '<div style="align-self:center;margin-left:auto;text-align:right"><div class="tiny">共 '+o.items.reduce(function(s,x){return s+x.qty},0)+' 件</div><div style="font-size:19px;color:var(--danger);font-family:var(--serif);font-weight:700">'+window.HJ.money(o.total)+'</div></div></div>'+
      '<div class="of"><span class="tiny">收货：'+o.info.name+' · '+o.info.phone+' · '+o.info.addr+'</span>'+
      '<a class="btn btn-ghost btn-sm" href="success.html?no='+encodeURIComponent(o.no)+'">查看详情</a></div></div>';
  }
  function show(list){
    if(!list.length){res.innerHTML='<div class="card center small" style="padding:40px">未查询到匹配的订单。本站订单仅保存在提交订单的浏览器中。</div>';return}
    res.innerHTML='<h3 style="font-family:var(--serif);margin:16px 0">共 '+list.length+' 笔订单</h3>'+list.map(card).join('');
  }
  document.getElementById('qBtn').addEventListener('click',function(){
    var no=document.getElementById('qNo').value.trim().toUpperCase(),ph=document.getElementById('qPhone').value.trim();
    show(orders.filter(function(o){return (!no||o.no===no)&&(!ph||o.info.phone===ph)}));
  });
  document.getElementById('qAll').addEventListener('click',function(){show(orders)});
  if(orders.length)show(orders);
  var c=document.getElementById('drawerClose');
  if(c)c.addEventListener('click',function(){document.getElementById('drawerMask').classList.remove('on');document.getElementById('drawer').classList.remove('on')});
})();
</script>
</body></html>
