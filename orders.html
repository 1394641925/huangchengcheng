<section><div class="wrap" style="max-width:860px">
  <div class="card section-card">
    <h4 style="font-family:var(--serif);font-size:18px;letter-spacing:.08em;margin-bottom:16px">查询预约</h4>
    <div class="form-grid">
      <div class="field"><label>预约编号</label><input id="qNo" placeholder="例如 HC-20261122-1234"></div>
      <div class="field"><label>联系电话</label><input id="qPhone" placeholder="预约时填写的手机号"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
      <button class="btn btn-solid" id="qBtn">查询预约</button>
      <button class="btn btn-outline" id="qAll">查看本机全部预约</button>
    </div>
  </div>

</div></section>

<footer class="foot"><div class="wrap"><div class="bottom"><span>© 2026 皇城殡仪服务馆 · 本站为虚构商业演示网站</span><span>隐私政策 · 服务条款</span></div></div></footer>
<script src="assets/data.js"></script><script src="assets/app.js"></script>
<script>
(function(){
  var orders=window.HJ.readOrders(),res=document.getElementById('result');
  function card(o){
    return '<div class="card order-card"><div class="oh"><div><b>'+o.no+'</b> <span class="tiny">'+o.time+'</span></div><span class="status">'+o.status+'</span></div>'+
      '<div class="items">'+o.items.map(function(x){return '<div style="text-align:center"><img src="'+x.img+'" alt=""><div class="tiny">×'+x.qty+'</div></div>'}).join('')+
      '<div style="align-self:center;margin-left:auto;text-align:right"><div class="tiny">共 '+o.items.reduce(function(s,x){return s+x.qty},0)+' 项服务</div><div style="font-size:19px;color:var(--copper);font-family:var(--serif);font-weight:600">'+window.HJ.money(o.total)+'</div></div></div>'+
      '<div class="of"><span class="tiny">联系人：'+o.info.name+' · '+o.info.phone+' · '+o.info.addr+'</span>'+
      '<a class="btn btn-outline btn-sm" href="success.html?no='+encodeURIComponent(o.no)+'">查看详情</a></div></div>';
  }
  function show(list){
    if(!list.length){res.innerHTML='<div class="card center small" style="padding:40px;margin-top:20px">未查询到匹配的预约。本站预约仅保存在提交预约的浏览器中。</div>';return}
    res.innerHTML='<h3 style="font-family:var(--serif);margin:22px 0 16px;letter-spacing:.08em">共 '+list.length+' 笔预约</h3>'+list.map(card).join('');
  }
  document.getElementById('qBtn').addEventListener('click',function(){
    var no=document.getElementById('qNo').value.trim().toUpperCase(),ph=document.getElementById('qPhone').value.trim();
    show(orders.filter(function(o){return (!no||o.no===no)&&(!ph||o.info.phone===ph)}));
  });
  document.getElementById('qAll').addEventListener('click',function(){show(orders)});
  if(orders.length)show(orders);
  var c=document.getElementById('drawerClose');
  if(c)c.addEventListener('click',function(){document.getElementById('drawerMask').classList.remove('on');document.getElementById('drawer').classList.remove('on')});
})();
</script>
